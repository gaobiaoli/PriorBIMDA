extends: stanford_area1_transfer_e2e.yaml

experiment:
  name: stanford_area1_e2e
  output_dir: outputs/stanford_area1_e2e

train:
  # Stage two starts from the accepted target-frozen checkpoint; retain the
  # target-domain residual heads learned in stage one.
  init_checkpoint_policy: preserve
  refiner_head_warmup_epochs: 0
  batch_size: 4
  gradient_accumulation: 2
  learning_rate: 0.00001
  da3_learning_rate: 0.000001

loss:
  furniture_multiplier: 2.0
  bim_foreground_conflict_multiplier: 2.0
