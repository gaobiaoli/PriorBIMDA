extends: stanford_area1_dav2_early_fusion_joint_scale_low18_low36_3epoch_full_depth_metric_da3.yaml

# Controlled scale+r72-only comparison. The 18x18 residual path is frozen and
# the shared native residual head consumes the pre-upsampling 72x72 DPT stage.
experiment:
  name: stanford_area1_dav2_early_fusion_scale_low72_only_3epoch
  output_dir: outputs/stanford_area1_dav2_early_fusion_scale_low72_only_3epoch
  results_dir: results/stanford_area1/dav2_early_fusion_scale_low72_only_3epoch

model:
  dav2_joint_scale_low:
    residual_mode: low72_only
    residual_composition: low72_only

loss:
  low1_residual_teacher: 0.0
  low2_residual_teacher: 0.50
  residual_zero_mean: 0.10

train:
  epochs: 3
