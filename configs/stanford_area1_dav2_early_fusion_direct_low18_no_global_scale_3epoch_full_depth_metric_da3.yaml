extends: stanford_area1_dav2_early_fusion_joint_scale_low18_low36_3epoch_full_depth_metric_da3.yaml

# One pretrained DAv2 ViT-B/DPT pass predicts a native 18x18 log-depth
# correction directly. Its DC component replaces the separate global scale;
# no scale head, r36 band, or residual zero-mean constraint is used.
experiment:
  name: stanford_area1_dav2_early_fusion_direct_low18_no_global_scale_3epoch
  output_dir: outputs/stanford_area1_dav2_early_fusion_direct_low18_no_global_scale_3epoch
  results_dir: results/stanford_area1/dav2_early_fusion_direct_low18_no_global_scale_3epoch

model:
  dav2_joint_scale_low:
    residual_mode: direct_low18
    global_scale_enabled: false
    scale_feature: none
    residual_features:
      low1: dpt_deepest_top_down_pre_upsample_native_18x18
      low2: disabled
    residual_composition: direct_low18_only
    # Direct r18 must contain both scale and spatial correction. Match the
    # project's existing maximum total log-residual range.
    max_low1_log_residual: 0.45
    equivariance_probability: 0.0
    equivariance_log_range: 0.0

loss:
  depth: 1.0
  attention_scale_oracle: 0.0
  attention_scale_equivariance: 0.0
  low1_residual_teacher: 0.50
  low2_residual_teacher: 0.0
  residual_zero_mean: 0.0

train:
  epochs: 3
  scale_head_learning_rate: 0.0

