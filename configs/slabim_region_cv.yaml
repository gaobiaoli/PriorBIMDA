schema_version: 1
protocol_id: slabim_region_cv

# Six-region retrospective CV within the registered SLABIM building.
# 5F_Region1 remains an external holdout and is never used for model selection.
regions:
  - 3F_Region2
  - 3F_Region3
  - 4F_Region2
  - 4F_Region3
  - 5F_Region2
  - 5F_Region3

# Each region is outer-test and validation exactly once; validation is always
# on another floor and is the only source used for checkpoint selection.
validation_map:
  3F_Region2: 4F_Region2
  3F_Region3: 5F_Region3
  4F_Region2: 5F_Region2
  4F_Region3: 3F_Region2
  5F_Region2: 3F_Region3
  5F_Region3: 4F_Region3

seeds:
  - 41
  - 42
  - 43

templates:
  pretrain: configs/slabim_cv_pretrain.yaml
  final: configs/slabim_cv.yaml

output_root: outputs/slabim_region_cv

# Validation-best checkpoints drive both stage transfer and held-out testing.
# accepted.pt may still be emitted by training as an acceptance diagnostic.
checkpoint_selection:
  pretrain: best
  final: best

data:
  # The other five regions were already prepared at source stride 2.
  record_stride_by_region:
    5F_Region2: 2

train:
  samples_per_epoch: 480
