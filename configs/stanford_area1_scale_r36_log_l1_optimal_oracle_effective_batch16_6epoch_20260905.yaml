# Original scale+r36 baseline with one controlled change: every train/val/test
# oracle scale used by this trainer is the depth-supervision-weighted median of
# log(GT / DA3), i.e. the exact per-frame optimum of weighted log-L1. The scale
# head retains the baseline SmoothL1 scalar-teacher loss.
experiment:
  name: stanford_area1_scale_r36_log_l1_optimal_oracle_effective_batch16_6epoch_20260905
  output_dir: outputs/stanford_area1_scale_r36_log_l1_optimal_oracle_effective_batch16_6epoch_20260905
  results_dir: results/stanford_area1/scale_r36_log_l1_optimal_oracle_effective_batch16_6epoch_20260905

loss:
  oracle_scale_estimator: log_l1_optimal
