experiment:
  name: slabim_single_frame_r50_v2
  seed: 42
  output_dir: outputs/slabim_single_frame_r50_v2

data:
  slabim_root: ../SLABIM
  processed_root: data/processed/slabim_504_r50
  regions:
    - 3F_Region2
    - 3F_Region3
    - 4F_Region2
    - 4F_Region3
    - 5F_Region2
    - 5F_Region3
  train_regions:
    - 3F_Region2
    - 3F_Region3
    - 4F_Region2
    - 4F_Region3
  val_regions:
    - 5F_Region3
  test_regions:
    - 5F_Region2
  target_height: 504
  target_width: 504
  min_depth: 0.2
  max_depth: 5.0
  max_time_diff: 0.06
  fusion_radius: 50
  splat_radius: 1
  occlusion_abs_m: 0.06
  occlusion_rel: 0.02
  min_gt_support: 1
  pose_bim_file: lidar_pose_local_to_bim_from_rosbag.txt
  pose_slam_file: lidar_pose_local_to_slam_smoothed.txt
  da3_cache_roots: {}
  da3_model: depth-anything/da3metric-large
  da3_process_res: 504

model:
  strong_anchor: true
  base_channels: 24
  max_log_residual: 0.16
  initial_gate_bias: -1.5
  trust_channels: 32
  alignment_kernel: 31
  alignment_downsample: 4
  alignment_huber_delta: 0.08
  alignment_min_support: 0.02
  alignment_scale_min: 0.5
  alignment_scale_max: 2.0
  use_rgb: true
  use_bim_normals: true

loss:
  depth: 1.0
  gradient: 0.15
  trust: 0.15
  frame_trust: 0.03
  uncertainty: 0.02
  bim_anchor: 0.0
  degradation: 1.5
  preservation: 0.75
  update_gate: 0.10
  near_range_boost: 1.0
  preservation_log_threshold: 0.04
  update_gate_temperature: 0.02
  trust_margin: 0.005
  trust_temperature: 0.03

train:
  epochs: 50
  batch_size: 2
  num_workers: 2
  learning_rate: 0.00005
  weight_decay: 0.0001
  amp: true
  gradient_accumulation: 2
  gradient_clip_norm: 1.0
  log_every: 25
  save_every: 1
  early_stopping_patience: 10
  augment:
    horizontal_flip_probability: 0.5
    color_jitter: 0.10
    bim_shift_probability: 0.0
    bim_shift_pixels: 5
    bim_dropout_probability: 0.0
    bim_dropout_fraction: 0.15
    crop_height: 416
    crop_width: 416

evaluation:
  distance_bins: [0.2, 1.0, 2.0, 3.0, 5.0]
  min_valid_points: 50
