extends: stanford_area1_dav2_early_fusion_scale_low36_only_6epoch_continuous_calibrated_disagreement_adapter_32_64_128_decoder_128_64_32_full_depth_metric_da3.yaml

# Iterative two-level post-fusion geometry experiment:
#   D_s   = D_DA3 * exp(c)
#   C18   = geometry(D_BIM, stopgrad(D_s))
#   r18   = R18(F18 + A18(C18))
#   D_s18 = D_s * exp(r18)
#   C36   = geometry(D_BIM, stopgrad(D_s18))
#   r36   = R36(F36 + A36(C36))
# A18 and A36 are independent 3->32->3xResBlock->64->128 zero-init
# geometry encoders. Both residual decoders use 128->64->32->1. The r36
# condition is detached from r18, while final-depth and native teacher losses
# continue to supervise both residual levels through their direct outputs.
experiment:
  name: stanford_area1_dav2_early_fusion_scale_iterative_geometry_r18_r36_6epoch_continuous
  output_dir: outputs/stanford_area1_dav2_early_fusion_scale_iterative_geometry_r18_r36_6epoch_continuous
  results_dir: results/stanford_area1/dav2_early_fusion_scale_iterative_geometry_r18_r36_6epoch_continuous

model:
  dav2_joint_scale_low:
    residual_mode: low18_low36
    residual_composition: upsample_low1_plus_laplacian_low2
    low1_decoder_hidden_channels:
      - 64
      - 32
    low2_decoder_hidden_channels:
      - 64
      - 32
    calibrated_disagreement_adapter:
      enabled: false
    iterative_geometry_adapters:
      enabled: true
      hidden_channels: 32
      residual_blocks: 3
      expansion_channels: 64

loss:
  low1_residual_teacher: 0.25
  low2_residual_teacher: 0.50
  residual_zero_mean: 0.10
