# measured log-ratio remain unchanged.

experiment:
  name: stanford_area1_full_regression_scale_no_da3_features_no_confidence_no_bim_geometry_3round_3epoch
  output_dir: outputs/stanford_area1_full_regression_scale_no_da3_features_no_confidence_no_bim_geometry_3round_3epoch

model:
  attention_scale:
    use_bim_normals: false
    use_bim_edge: false
