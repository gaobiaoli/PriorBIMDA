extends: stanford_area1_attentive_scale_da3_features_hit_only_full_depth_metric_da3.yaml

# Independent scale-only challenger. BIM/DA3 ratios are neural input features;
# no pseudo-Huber weight, IRLS center, weighted ratio mean, damping, or learned
# fallback gate participates in the predicted scale.

experiment:
  name: stanford_area1_full_regression_scale_3round_3epoch_full_depth_metric_da3
  output_dir: outputs/stanford_area1_full_regression_scale_3round_3epoch_full_depth_metric_da3

model:
  attention_scale:
    estimator: full_regression_iterative_v1
    iterative_updates: 3
    iterative_hidden_channels: 32
    delta_hidden_channels: 64
    iterative_max_log_update: 0.15
    # Explicitly neutralize the inherited static-head option. Full regression
    # has no post-recurrence absolute-scale MLP or fallback interpolation.
    bounded_log_scale_residual: 0.0
    use_fallback_gate: false

loss:
  attention_scale_iteration_weights: [0.25, 0.50, 1.00]
  attention_scale_residual: 0.0

train:
  epochs: 3
  scale_only_experiment: true
  early_stopping_patience: 3
  log_every: 200
