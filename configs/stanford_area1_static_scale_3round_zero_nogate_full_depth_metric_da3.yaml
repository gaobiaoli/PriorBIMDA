extends: stanford_area1_iterative_scale_3round_full_depth_metric_da3.yaml

# Matched control for scale-conditioned attention.  It uses the same shared
# reliability MLP, z^(0)=0, three bounded/damped updates, loss, data, seed, and
# scratch schedule as the refreshed estimator.  Attention is computed once at
# z^(0) and then frozen, so refresh-vs-static is the only architectural change.

experiment:
  name: stanford_area1_static_scale_3round_zero_nogate_full_depth_metric_da3
  output_dir: outputs/stanford_area1_static_scale_3round_zero_nogate_full_depth_metric_da3

model:
  attention_scale:
    iterative_refresh_attention: false
    use_fallback_gate: false

train:
  log_every: 200
