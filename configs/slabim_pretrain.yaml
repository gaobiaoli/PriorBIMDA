extends: slabim_base.yaml

experiment:
  name: slabim_pretrain
  output_dir: outputs/slabim_pretrain

data:
  # Fixed 70/15/15 temporal-segment annotation with fused-LiDAR embargo.
  split_annotation: data/annotations/slabim_clean_global_v1.jsonl
  split_annotation_sha256: "55e4a44afa27247557ba59dcd56d54385f0121d12257f4ceb6407702fc5ba3ce"
  split_fingerprint_sha256: "102a5d0e262f8e44354f596164630f27a03f47e78fe361e1ef134b05320c4fbc"
  train_regions: []
  val_regions: []
  test_regions: []
  record_stride_by_region: {}

train:
  # Global pooled baseline: one shuffled pass over all 496 clean samples.
  # Batch 16 uses the 16 GiB GPU efficiently and divides 496 exactly.
  batch_size: 16
  num_workers: 8
  learning_rate: 0.00045
  lr_warmup_epochs: 2
  amp_init_scale: 32768
  region_balanced_sampling: false
  samples_per_epoch: null
