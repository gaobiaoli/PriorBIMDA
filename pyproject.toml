[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bim-priorda3"
version = "0.1.0"
description = "Learned BIM-prior refinement for single-frame metric depth"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "open3d>=0.18",
  "plyfile>=1.0",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/gaobiaoli/PriorBIMDA"
Repository = "https://github.com/gaobiaoli/PriorBIMDA"
Documentation = "https://github.com/gaobiaoli/PriorBIMDA/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
da3 = ["depth-anything-3"]
slabim = ["rosbags>=0.10"]
stanford = ["ifcopenshell>=0.8.5; python_version >= '3.10'"]
matterport = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bim_priorda3 = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
